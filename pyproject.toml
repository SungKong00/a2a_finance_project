[project]
name = "my-a2a-stock-analysis"
version = "0.1.0"
description = "A2A Stock Analysis Multi-Agent System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=1.19.0",
]

[tool.uv.workspace]
members = [
    "hosts/multiagent",
    "extensions/timestamp",
    "demo/ui",
    "agents/technical_analyst",
    "agents/fundamental_analyst",
    "agents/sentiment_analyst",
    "agents/risk_assessor",
]
