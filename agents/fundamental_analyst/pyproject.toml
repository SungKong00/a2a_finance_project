[project]
name = "fundamental-analyst-agent"
version = "0.1.0"
description = "A2A Fundamental Analyst Agent specializing in financials and valuation"
requires-python = ">=3.12"
dependencies = [
    "google-adk[a2a]>=1.7.0",
    "uvicorn>=0.34.0",
    "python-dotenv>=1.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
