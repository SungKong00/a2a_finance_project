[project]
name = "mcp-stock-server"
version = "0.1.0"
description = "MCP Server for Stock Data"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "yfinance>=0.2.40",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
